services:
  # Azurite: Local storage emulator for Azure Functions TimerTrigger state and WebJobs
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: calmclass-azurite
    hostname: azurite
    restart: unless-stopped
    ports:
      - "10000:10000" # Blob service
      - "10001:10001" # Queue service
      - "10002:10002" # Table service
    volumes:
      - azurite_data:/data

  # Azure Cosmos DB Linux Emulator (optional for local multi-model NoSQL testing)
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: calmclass-cosmos-emulator
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "10251:10251"
      - "10252:10252"
      - "10253:10253"
      - "10254:10254"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 2
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"
    volumes:
      - cosmos_data:/tmp/cosmos/appdata
    profiles:
      - cosmos # Start with: docker compose --profile cosmos up -d

volumes:
  azurite_data:
  cosmos_data:
