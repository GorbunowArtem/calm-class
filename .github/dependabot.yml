version: 2
updates:
  # Maintain NuGet dependencies across application and Pulumi IaC
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "nuget"
    groups:
      pulumi-dependencies:
        applies-to: version-updates
        patterns:
          - "Pulumi*"
      framework-dependencies:
        applies-to: version-updates
        patterns:
          - "Microsoft.Azure.Functions*"
          - "Microsoft.Extensions*"
          - "Microsoft.Azure.Cosmos*"
      resilience-logging:
        applies-to: version-updates
        patterns:
          - "Polly*"
          - "Serilog*"

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
